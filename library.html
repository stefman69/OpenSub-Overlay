<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenSub Overlay Library</title>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>OpenSub Overlay Library</h1>
        <p>Saved subtitle bindings stay on this Chrome profile.</p>
      </div>
      <div class="actions"><button id="exportBackup">Export backup</button><label class="import">Import backup<input id="importBackup" type="file" accept="application/json,.json"></label></div>
    </header>
    <div id="empty" class="empty hidden">No saved subtitle pages yet.</div>
    <div id="list"></div>
  </main>
  <script src="library.js"></script>
</body>
</html>
